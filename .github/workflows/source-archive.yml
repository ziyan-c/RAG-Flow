name: Source archive

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to package"
        required: true
        type: string

permissions:
  contents: write

jobs:
  source-archive:
    name: Build source archive
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${tag}" =~ ^v ]]; then
            echo "Only v* tags can be packaged, got: ${tag}" >&2
            exit 1
          fi
          safe_tag="${tag//\//-}"
          repo_name="${GITHUB_REPOSITORY#*/}"
          archive_name="${repo_name}-${safe_tag}.tar.gz"
          {
            echo "tag=${tag}"
            echo "safe_tag=${safe_tag}"
            echo "repo_name=${repo_name}"
            echo "archive_name=${archive_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}
          fetch-depth: 0

      - name: Build tar.gz source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive \
            --format=tar.gz \
            --prefix="${{ steps.ref.outputs.repo_name }}-${{ steps.ref.outputs.safe_tag }}/" \
            --output="dist/${{ steps.ref.outputs.archive_name }}" \
            HEAD
          sha256sum "dist/${{ steps.ref.outputs.archive_name }}" \
            | tee "dist/${{ steps.ref.outputs.archive_name }}.sha256"
          ls -lh dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-${{ steps.ref.outputs.safe_tag }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.ref.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" dist/*.tar.gz dist/*.sha256 --clobber
          else
            gh release create "${TAG_NAME}" dist/*.tar.gz dist/*.sha256 \
              --verify-tag \
              --title "${TAG_NAME}" \
              --notes "Source archive generated from tag ${TAG_NAME}."
          fi
