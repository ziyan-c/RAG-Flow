[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-flow"
version = "0.1.0"
description = "Multimodal RAG pipeline for technical manuals."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "openai>=1.0",
  "pydantic>=2",
  "qdrant-client>=1.10",
  "requests>=2.31",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
retrieval = [
  "bitsandbytes",
  "colpali-engine",
  "fastembed",
  "torch",
  "transformers",
]
preprocess = [
  "modelscope",
  "pdf2image",
  "pillow",
  "pymupdf",
  "qwen-vl-utils",
  "tqdm",
]
"mineru" = [
  "mineru[all]==3.0.9; python_version < '3.14'",
]
dev = [
  "pytest>=8",
]

[project.scripts]
rag-flow = "rag_flow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
